<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tap Vibe | Anoop V S</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #eef1f5;
    color: #111827;
    min-height: 100vh;
    padding: 20px 12px;
}

.card {
    width: 100%;
    max-width: 430px;
    margin: auto;
    background: #ffffff;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0,0,0,0.12);
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #111827, #263447);
    color: white;
    text-align: center;
    padding: 32px 20px 38px;
}

.brand {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.brand span {
    color: #38bdf8;
}

.tagline {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.75;
}

/* PROFILE */
.profile {
    text-align: center;
    padding: 0 22px 25px;
}

.avatar {
    width: 105px;
    height: 105px;
    margin: -52px auto 15px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    border: 6px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 35px;
    font-weight: 800;
    box-shadow: 0 8px 25px rgba(0,0,0,0.18);
}

.name {
    font-size: 27px;
    font-weight: 800;
}

.profession {
    margin-top: 5px;
    color: #64748b;
    font-size: 16px;
}

.country {
    margin-top: 9px;
    font-size: 14px;
    color: #475569;
}

/* SECTION */
.section-title {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #94a3b8;
    margin: 5px 0 15px;
}

/* BUTTONS */
.buttons {
    padding: 0 22px;
    display: grid;
    gap: 11px;
}

.button {
    text-decoration: none;
    min-height: 53px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 700;
    transition: transform 0.15s;
}

.button:active {
    transform: scale(0.97);
}

.icon {
    width: 35px;
    font-size: 21px;
}

.call {
    background: #eaf3ff;
    color: #1769aa;
}

.whatsapp {
    background: #e9f9ef;
    color: #168542;
}

.email {
    background: #f1f3f5;
    color: #343a40;
}

.instagram {
    background: #fff0f5;
    color: #c13584;
}

.location {
    background: #fff4e8;
    color: #c45a00;
}

.profile-link {
    background: #eef2ff;
    color: #4338ca;
}

/* SAVE BUTTON */
.save-area {
    padding: 22px;
}

.save-button {
    width: 100%;
    border: none;
    border-radius: 16px;
    min-height: 58px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(17,24,39,0.2);
}

.save-button:active {
    transform: scale(0.98);
}

/* QR */
.qr-section {
    margin: 0 22px 25px;
    padding: 22px;
    background: #f8fafc;
    border-radius: 20px;
    text-align: center;
}

.qr-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 5px;
}

.qr-subtitle {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 15px;
}

#qrcode {
    display: flex;
    justify-content: center;
}

#qrcode img {
    padding: 8px;
    background: white;
    border-radius: 10px;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 0 20px 25px;
    font-size: 11px;
    color: #94a3b8;
    letter-spacing: 1px;
}

@media (max-width: 380px) {
    .name {
        font-size: 24px;
    }

    .button {
        min-height: 50px;
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- HEADER -->
    <div class="header">
        <div class="brand">TAP <span>VIBE</span></div>
        <div class="tagline">SMART DIGITAL BUSINESS CARD</div>
    </div>

    <!-- PROFILE -->
    <div class="profile">

        <div class="avatar">AV</div>

        <div class="name">ANOOP V S</div>

        <div class="profession">Freelancer</div>

        <div class="country">🇦🇪 United Arab Emirates</div>

    </div>

    <!-- CONNECTION BUTTONS -->
    <div class="section-title">
        CONNECT WITH ME
    </div>

    <div class="buttons">

        <!-- CALL -->
        <a class="button call"
           href="tel:+971525670646">
            <span class="icon">📞</span>
            <span>Call Me</span>
        </a>

        <!-- WHATSAPP -->
        <a class="button whatsapp"
           href="https://wa.me/971525670646"
           target="_blank">
            <span class="icon">💬</span>
            <span>WhatsApp</span>
        </a>

        <!-- EMAIL -->
        <a class="button email"
           href="mailto:anoopvs2018@gmail.com">
            <span class="icon">✉️</span>
            <span>Email Me</span>
        </a>

        <!-- INSTAGRAM -->
        <a class="button instagram"
           href="https://www.instagram.com/be_water_m.y_friend/"
           target="_blank">
            <span class="icon">📷</span>
            <span>Instagram</span>
        </a>

        <!-- LOCATION -->
        <a class="button location"
           href="https://www.google.com/maps/search/?api=1&query=Abu+Dhabi"
           target="_blank">
            <span class="icon">📍</span>
            <span>Location</span>
        </a>

        <!-- PROFILE LINK -->
        <a class="button profile-link"
           href="https://anoopvs2018-hue.github.io/Tap-vibe-card/"
           target="_blank">
            <span class="icon">🔗</span>
            <span>My Tap Vibe Profile</span>
        </a>

    </div>

    <!-- SAVE CONTACT -->
    <div class="save-area">

        <button class="save-button" onclick="saveContact()">
            💾 SAVE CONTACT
        </button>

    </div>

    <!-- QR CODE -->
    <div class="qr-section">

        <div class="qr-title">
            SCAN TO SHARE MY CARD
        </div>

        <div class="qr-subtitle">
            Scan this QR code to open my Tap Vibe profile
        </div>

        <div id="qrcode"></div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        POWERED BY TAP VIBE
    </div>

</div>


<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

/* TAP VIBE PROFILE URL */
const profileURL =
"https://anoopvs2018-hue.github.io/Tap-vibe-card/";


/* CREATE QR CODE */
new QRCode(document.getElementById("qrcode"), {
    text: profileURL,
    width: 190,
    height: 190,
    correctLevel: QRCode.CorrectLevel.H
});


/* SAVE CONTACT */
function saveContact() {

    const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:ANOOP V S
N:V S;ANOOP;;;
TITLE:Freelancer
TEL;TYPE=CELL:+971525670646
EMAIL:anoopvs2018@gmail.com
URL:${profileURL}
NOTE:Tap Vibe Digital Business Card
END:VCARD`;

    const blob = new Blob(
        [vCard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "Anoop-V-S.vcf";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);
}

</script>

</body>
</html>
